version: "3.9"

services:
  backend:
    build: ./Backend
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
      image: redis:7-alpine
      container_name: redis
      restart: always

      ports:
        - "6379:6379"

      volumes:
        - redis-data:/data
volumes:
    redis-data: